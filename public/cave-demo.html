<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = (id) => document.getElementById(id);
const showErr = (msg) => { const e = $('err'); e.style.display = 'block'; e.textContent = String(msg); };

// ---------------- 车体手感（与 Boat.js 半重档同源） ----------------
const HULL = {
  maxSpeed: 30, accel: 22, spool: 0.55, coastDrag: 0.10,
  yawPeak: 1.10, yawTau: 0.34, grip: 5.4,
  driftDrag: 0.55, driftCut: 0.04, bounce: 0.35,
};
const MAX_LAT = 6.2;      // 洞内离中心线最大横向距离（洞半宽 10，留安全边）

// ---------------- 中心线 ----------------
let CL = null;            // points[{x,y,z,yaw,width,kind}]
const state = {
  x: 0, z: 0, heading: 0, vf: 0, vl: 0, angVel: 0, thrust: 0,
  drifting: false, driftDir: 0, driftTime: 0, wasDrifting: false,
  miniQueue: 0, miniTimer: 0, miniGap: 0, nearest: 0, progress: 0, speed: 0, vx: 0, vz: 0, _segShown: {}, _segShown: {},
};

function nearestOnCenter(x, z, hint) {
  // 局部搜索：从上次索引附近找最近点（点数少，全局扫也行，但局部更稳）
  const n = CL.length;
  let best = hint ?? 0, bestD = Infinity;
  const scan = (i) => {
    const p = CL[((i % n) + n) % n];
    const d = (p.x - x) * (p.x - x) + (p.z - z) * (p.z - z);
    if (d < bestD) { bestD = d; best = ((i % n) + n) % n; }
  };
  if (hint == null) { for (let i = 0; i < n; i++) scan(i); }
  else {
    for (let i = hint - 12; i <= hint + 12; i++) scan(i);
    // 冲出赛道太远时，局部窗口会锁死在旧索引 → lat 算成几十米 → 一帧拉回 + 弹射 → 数值爆掉
    // （这就是"速度变 NaN 必须刷新"的根因）。离得太远就全局重找。
    if (bestD > 1600) { best = 0; bestD = Infinity; for (let i = 0; i < n; i++) scan(i); }
  }
  return { i: best, d: Math.sqrt(bestD) };
}

function centerDir(i) {
  const a = CL[Math.max(0, i - 1)], b = CL[Math.min(CL.length - 1, i + 1)];
  const dx = b.x - a.x, dz = b.z - a.z;
  const L = Math.hypot(dx, dz) || 1;
  return { dx: dx / L, dz: dz / L };
}

// ---------------- 物理 ----------------
function step(dt, input) {
  // 漂移状态机
  const driftWanted = !!input.drift && state.vf > 4;
  if (driftWanted && !state.drifting && Math.abs(input.steer) > 0.08) {
    state.driftDir = Math.sign(input.steer);
    state.driftTime = 0;
    state.vf *= (1 - HULL.driftCut);   // 入漂一脚掉速（很小）
  }
  state.drifting = driftWanted && state.driftDir !== 0;
  if (state.drifting) state.driftTime += dt;

  // 出弯：单喷/双喷（≥0.55s 一喷，≥1.18s 双喷，间隔 0.75s）
  if (!state.drifting && state.wasDrifting) {
    const charge = state.driftTime;
    state.miniQueue = charge >= 1.18 ? 2 : charge >= 0.55 ? 1 : 0;
    state.miniGap = 0;
    if (state.miniQueue > 0) flashBoost(state.miniQueue);
  }
  state.wasDrifting = state.drifting;

  // 推力：一阶滞后 → (1 - v/vmax) 渐近极速
  const target = input.throttle > 0 ? HULL.accel * input.throttle
    : input.throttle < 0 ? HULL.accel * 0.55 * input.throttle : 0;
  state.thrust += (target - state.thrust) * (1 - Math.exp(-dt / HULL.spool));
  const vRatio = Math.max(0, Math.min(1, state.vf / HULL.maxSpeed));
  state.vf += state.thrust * (1 - vRatio) * dt;

  // 水阻：只在松油门/超速/漂移中
  const coasting = input.throttle <= 0 || state.vf > HULL.maxSpeed || state.drifting;
  if (coasting) {
    const dragMul = state.drifting ? HULL.driftDrag : 1;
    const dragF = HULL.coastDrag + (state.vf * state.vf) / (HULL.maxSpeed * HULL.maxSpeed) * HULL.coastDrag;
    state.vf -= state.vf * dragF * dragMul * dt;
  }

  // 侧向
  state.vl *= Math.exp(-HULL.grip * (state.drifting ? 0.30 : 1) * dt);

  // 转向：角速度追赶目标（低速转不动，高速略收）
  const sp = Math.min(1, Math.abs(state.vf) / HULL.maxSpeed);
  const lowRaw = Math.max(0, Math.min(1, (sp - 0.04) / 0.26));
  const lowCut = lowRaw * lowRaw * (3 - 2 * lowRaw);
  const highCut = 1 - 0.22 * Math.max(0, Math.min(1, (sp - 0.75) / 0.25));
  const curve = lowCut * lowCut * (3 - 2 * lowCut) * highCut;
  const targetYaw = (state.drifting ? 1.7 : 1) * input.steer * HULL.yawPeak * curve;
  state.angVel += (targetYaw - state.angVel) * (1 - Math.exp(-dt / HULL.yawTau));
  state.heading += state.angVel * dt;

  // 云端强风：侧向阵风（洞里没有），风把船往航道外推，要提前打方向
  state.t = (state.t || 0) + dt;
  if (CL[state.nearest] && CL[state.nearest].kind === 'cloud') {
    const dW = centerDir(state.nearest);
    const gust = 0.55 + 0.45 * Math.sin(state.t * 0.9) * Math.sin(state.t * 0.31 + 1.7);
    const amp = 3.4 * gust;
    state.vx += dW.dz * amp * dt;
    state.vz += -dW.dx * amp * dt;
  }

  // 位移
  const fx = Math.sin(state.heading), fz = Math.cos(state.heading);
  const vx = fx * state.vf + fz * state.vl;
  const vz = fz * state.vf - fx * state.vl;
  state.x += vx * dt;
  state.z += vz * dt;
  state.vx = vx; state.vz = vz;

  // 双喷脉冲
  if (state.miniQueue > 0 && state.miniTimer <= 0) {
    if (state.miniGap <= 0) {
      state.miniQueue--;
      state.miniTimer = 0.55; state.miniGap = 0.75;
      state.vf = Math.min(state.vf + 5.5, HULL.maxSpeed * 1.25);
    }
  } else if (state.miniGap > 0) state.miniGap -= dt;
  if (state.miniTimer > 0) state.miniTimer -= dt;

  // 洞壁约束：沿中心线径向推回 + 回弹
  const near = nearestOnCenter(state.x, state.z, state.nearest);
  state.nearest = near.i;
  const dir = centerDir(near.i);
  const p = CL[near.i];
  const nx = dir.dz, nz = -dir.dx;         // 中心线左法线
  let lat = (state.x - p.x) * nx + (state.z - p.z) * nz;
  // 云端段无墙：横向边界放到 34m，靠"强风"把船推歪，而不是撞墙
  const kW = CL[near.i].kind;
  const mlat = kW === 'cloud' ? 34 : (kW === 'forest' ? 9.0 : MAX_LAT);
  if (Math.abs(lat) > mlat) {
    const s = Math.sign(lat);
    state.x = p.x + nx * mlat * s;
    state.z = p.z + nz * mlat * s;
    const vn = state.vx * nx + state.vz * nz;
    if (vn * s > 0) {
      const rest = HULL.bounce + 0.4 * Math.min(1, Math.hypot(state.vx, state.vz) / HULL.maxSpeed);
      state.vx -= (1 + rest) * vn * nx * s;
      state.vz -= (1 + rest) * vn * nz * s;
      const fx2 = Math.sin(state.heading), fz2 = Math.cos(state.heading);
      state.vf = state.vx * fx2 + state.vz * fz2;
      state.vl = state.vx * fz2 - state.vz * fx2;
      state.angVel *= 0.4;
    }
  }
  // 蘑菇障碍：圆碰撞（数据来自 centerline.json 的 obstacles，逐株带中心线索引）
  for (const ob of (state.obstacles || [])) {
    if (Math.abs(ob.i - near.i) > 5) continue;
    const dxo = state.x - ob.x, dzo = state.z - ob.z;
    const d = Math.hypot(dxo, dzo), min = ob.r + 1.25;
    if (d < min && d > 0.001) {
      const onx = dxo / d, onz = dzo / d;
      state.x = ob.x + onx * min;
      state.z = ob.z + onz * min;
      const vn = state.vx * onx + state.vz * onz;
      if (vn < 0) {
        const rest = 0.3 + 0.4 * Math.min(1, Math.hypot(state.vx, state.vz) / HULL.maxSpeed);
        state.vx -= (1 + rest) * vn * onx;
        state.vz -= (1 + rest) * vn * onz;
        state.vf *= 0.78;          // 撞蘑菇吃亏，绕着走才有走线价值
        state.angVel *= 0.5;
      }
    }
  }
  // 高度：沿最近段插值（洞内 y=0，阶梯段 y 渐升）
  const qa = CL[near.i], qb = CL[Math.min(CL.length - 1, near.i + 1)];
  const sdx = qb.x - qa.x, sdz = qb.z - qa.z;
  const L2 = sdx * sdx + sdz * sdz || 1;
  let tt = ((state.x - qa.x) * sdx + (state.z - qa.z) * sdz) / L2;
  tt = Math.max(0, Math.min(1, tt));
  state.y = qa.y + (qb.y - qa.y) * tt;
  state.pitch = Math.atan2(qb.y - qa.y, Math.sqrt(L2));
  state.progress = near.i / (CL.length - 1);
  state.speed = Math.hypot(state.vx, state.vz);

  // 终点软墙：跑到末端就不许再往前（以前会一直冲出去变成"出界"）
  if (near.i >= CL.length - 2) {
    const tail = CL[CL.length - 1], prev = CL[CL.length - 2];
    const tx = tail.x - prev.x, tz = tail.z - prev.z;
    const tl = Math.hypot(tx, tz) || 1;
    const over = (state.x - tail.x) * (tx / tl) + (state.z - tail.z) * (tz / tl);
    if (over > 0) {
      state.x -= (tx / tl) * over;
      state.z -= (tz / tl) * over;
      state.vf *= 0.15; state.vx *= 0.15; state.vz *= 0.15;
      state.finished = true;
    }
  }

  // 数值守卫：任何 NaN / Infinity 就地重生到最近的合法点（以前只能刷新页面）
  if (!Number.isFinite(state.x) || !Number.isFinite(state.z) ||
      !Number.isFinite(state.vf) || !Number.isFinite(state.heading) ||
      !Number.isFinite(state.vx) || !Number.isFinite(state.vz)) {
    respawnAt(state.nearest);
  }
}

// ---------------- three.js 场景 ----------------
let renderer, scene, camera, boatRoot, boatModel, waterMesh, headlight, composer, skyDome;
const segObjs = {};
const SEG_ORDER = ['cave', 'stairs', 'cloud', 'fall', 'forest'];
const caveLights = [];
const caveBulbs = [];     // 已不再生成灯泡（洞内不该有悬浮发光球），保留数组兼容
let sunLight = null, hemiLight = null;
const keys = new Set();
window.addEventListener('keydown', (e) => {
  if (['KeyW','KeyA','KeyS','KeyD','ShiftLeft','ShiftRight','Space'].includes(e.code)) e.preventDefault();
  keys.add(e.code);
  if (e.code === 'KeyR') respawnAt(state.nearest);
  if (e.code === 'KeyT') {
    const keys = Object.keys(WEATHERS);
    weatherKey = keys[(keys.indexOf(weatherKey) + 1) % keys.length];
    const el = document.getElementById('wx');
    if (el) el.textContent = WEATHERS[weatherKey].name;
  }
  if (/^Digit[1-5]$/.test(e.code)) {
    const n = +e.code.slice(5);
    if (SEGMENTS[n - 1]) jumpToSegment(SEGMENTS[n - 1].kind);
  }
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

function respawnAt(idx) {
  const i = Math.max(1, Math.min(CL.length - 2, (idx | 0) || 2));
  const p = CL[i], d = centerDir(i);
  state.x = p.x; state.z = p.z;
  state.heading = Math.atan2(d.dx, d.dz);
  state.vf = state.vl = state.thrust = state.angVel = 0;
  state.vx = state.vz = 0; state.nearest = i;
  state.drifting = false; state.driftTime = 0; state.miniQueue = 0;
  state.y = p.y; state.pitch = 0; state.speed = 0; state.t = 0; state.finished = false;
}
function resetBoat() { respawnAt(2); }

// ---------------- 分段试跑 ----------------
const SEGMENTS = [
  { kind: 'cave',   name: '① 山洞' },
  { kind: 'stairs', name: '② 阶梯' },
  { kind: 'cloud',  name: '③ 云端' },
  { kind: 'fall',   name: '④ 瀑布' },
  { kind: 'forest', name: '⑤ 森林' },
];
const segStart = {};
function jumpToSegment(kind) {
  if (!CL || segStart[kind] == null) return;
  respawnAt(segStart[kind] + 2);
  document.querySelectorAll('#segs button').forEach((b) => {
    b.classList.toggle('on', b.dataset.kind === kind);
  });
}

// 洞内天光：暖褐环境色（参考图那种明亮土洞，不是黑红恐怖洞）
const INDOOR_FOG = 0x452c19;
const INDOOR_SKY = 0xffdcb0;
const INDOOR_GROUND = 0x3f2818;

// 四种天气：只影响露天段（洞内是室内，不吃天气）
const WEATHERS = {
  clear: { name: '晴朗',   fog: 0xbfdcf2, sun: 0xfff2d8, sunMul: 1.00, hemi: 1.00,
           cloud: 0xffffff, leaf: 0xffffff, ground: 0xffffff,
           skyTop: 0x2f74c4, skyBot: 0xe4f2fb, water: 0x2f9a92 },
  dusk:  { name: '黄昏',   fog: 0xf0b98a, sun: 0xffae66, sunMul: 0.85, hemi: 0.85,
           cloud: 0xffd9b0, leaf: 0xf2e2c4, ground: 0xe0caa2,
           skyTop: 0x7b4f8f, skyBot: 0xffc089, water: 0x4a7a86 },
  storm: { name: '暴风雨', fog: 0x5c6a78, sun: 0x9fb0c0, sunMul: 0.45, hemi: 0.80,
           cloud: 0x8f9aa8, leaf: 0x8fa08a, ground: 0x8a9a86,
           skyTop: 0x323b46, skyBot: 0x8a95a0, water: 0x1f5f5a },
  snow:  { name: '暴风雪', fog: 0xd9e6f2, sun: 0xdfeaf8, sunMul: 0.65, hemi: 1.05,
           cloud: 0xe8f0fa, leaf: 0xd8c890, ground: 0xd2dcc4,
           skyTop: 0x8fa8c0, skyBot: 0xe8f0f8, water: 0x4f8a96 },
};
let weatherKey = 'clear';
let cloudMat = null, leafMat = null, groundMat = null, groundWater = null;

// 五段氛围：雾色 / 雾距 / 太阳 / 环境光 / 洞内灯
const ATMO = {
  cave:   { fog: INDOOR_FOG, near: 55,  far: 330,  sun: 0.0, hemi: 1.65, lamps: 300 },
  stairs: { fog: 0x8fb8d8,   near: 120, far: 600,  sun: 1.7, hemi: 0.95, lamps: 0 },
  cloud:  { fog: 0xbfdcf2,   near: 140, far: 1400, sun: 1.5, hemi: 0.90, lamps: 0 },
  fall:   { fog: 0xc6dce8,   near: 100, far: 700,  sun: 1.8, hemi: 1.00, lamps: 0 },
  forest: { fog: 0xa8c8ae,   near: 90,  far: 520,  sun: 1.9, hemi: 1.05, lamps: 0 },
};

function initScene() {
  renderer = new THREE.WebGLRenderer({ canvas: $('cv'), antialias: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.06;
  renderer.shadowMap.enabled = true;                 // 树/岛/云投影
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  scene = new THREE.Scene();
  window.__scene = scene;
  scene.background = new THREE.Color(INDOOR_FOG);
  // 渐变天空：地平线浅、天顶深；洞内看不到（被洞壁挡住）
  const skyGeo = new THREE.SphereGeometry(1500, 24, 12);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      topColor: { value: new THREE.Color(0x2f74c4) },
      bottomColor: { value: new THREE.Color(0xe4f2fb) },
      offset: { value: 60.0 }, exponent: { value: 0.85 },
    },
    vertexShader: 'varying vec3 vW; void main(){ vW = (modelMatrix * vec4(position,1.0)).xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 topColor; uniform vec3 bottomColor; uniform float offset; uniform float exponent; varying vec3 vW; void main(){ float h = normalize(vW + vec3(0.0, offset, 0.0)).y; gl_FragColor = vec4(mix(bottomColor, topColor, pow(max(h,0.0), exponent)), 1.0); }',
  });
  skyDome = new THREE.Mesh(skyGeo, skyMat);
  skyDome.frustumCulled = false;
  scene.add(skyDome);
  scene.fog = new THREE.Fog(INDOOR_FOG, 55, 330);
  camera = new THREE.PerspectiveCamera(66, innerWidth / innerHeight, 0.1, 2600);
  hemiLight = new THREE.HemisphereLight(INDOOR_SKY, INDOOR_GROUND, 1.65);
  scene.add(hemiLight);
  sunLight = new THREE.DirectionalLight(0xfff2dd, 0);
  sunLight.position.set(120, 180, 40);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(1024, 1024);
  const shCam = sunLight.shadow.camera;
  shCam.left = -60; shCam.right = 60; shCam.top = 60; shCam.bottom = -60;
  shCam.near = 1; shCam.far = 320;
  sunLight.shadow.bias = -0.0009;
  sunLight.shadow.normalBias = 0.03;
  scene.add(sunLight);
  scene.add(sunLight.target);
  // 后处理：半分辨率 bloom，阈值高（只让水面/云边高光溢出）
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(
    new THREE.Vector2(innerWidth * 0.5, innerHeight * 0.5), 0.22, 0.55, 0.95));
  composer.addPass(new OutputPass());

  window.addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    if (composer) composer.setSize(innerWidth, innerHeight);
  });
}

function buildCenterLights() {
  // 只在山洞段布暖白灯：全段 395 点若每 6 点一盏会变成 65 盏点光，帧率直接崩
  const from = 2;
  const to = (segStart.stairs != null ? segStart.stairs : CL.length) - 2;
  for (let i = from; i < to; i += 6) {
    const p = CL[i];
    const light = new THREE.PointLight(0xffe2bd, 300, 130, 1.25);
    light.position.set(p.x, 6.0, p.z);
    scene.add(light);
    caveLights.push(light);
  }
}

function buildBoat() {
  boatRoot = new THREE.Group();
  boatRoot.rotation.order = 'YXZ';
  const inner = new THREE.Group();
  inner.rotation.y = -Math.PI / 2;   // rowboat.glb 船头沿 +X，转正到 +Z
  boatRoot.add(inner);
  scene.add(boatRoot);
  const loader = new GLTFLoader();
  loader.load('/models/rowboat.glb', (g) => {
    const m = g.scene;
    const box = new THREE.Box3().setFromObject(m);
    const len = box.max.z - box.min.z;
    m.scale.setScalar(4.6 / (len || 1));
    m.position.y -= box.min.y * (4.6 / (len || 1));
    inner.add(m);
  }, undefined, () => {
    // 兜底小艇
    const hull = new THREE.Mesh(
      new THREE.ConeGeometry(1.1, 4.6, 12).rotateX(Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0xe84a3f, roughness: 0.6 })
    );
    inner.add(hull);
  });
  // 船头灯
  headlight = new THREE.SpotLight(0xfff0d4, 220, 80, 0.6, 0.55, 1.3);
  headlight.position.set(0, 2.2, 1);
  const tgt = new THREE.Object3D(); tgt.position.set(0, 0.6, 26);
  boatRoot.add(tgt); headlight.target = tgt;
  boatRoot.add(headlight);
}

function tuneWorld(gltfScene) {
  gltfScene.traverse((o) => {
    if (o.isMesh) {
      if (o.name.startsWith('cloud')) {
        cloudMat = o.material;
        o.material.vertexColors = true;
        o.material.emissive = new THREE.Color(0xffffff);
        o.material.emissiveIntensity = 0.08;   // 云和岛共用材质，自发光高了岛会变灰蓝
        o.material.roughness = 1.0;
        o.material.metalness = 0.0;
        o.material.side = THREE.DoubleSide;
      } else if (o.name.startsWith('forest_water')) {
        waterMesh = o;
        groundWater = o.material = new THREE.MeshStandardMaterial({
          color: 0x2f9a92, roughness: 0.10, metalness: 0.25, side: THREE.DoubleSide,
          emissive: 0x0a3a36, emissiveIntensity: 0.18,
        });
      } else if (o.name.startsWith('cave_water')) {
        // 暗河水面：亮青色半反光，负责把洞底整个盖住（不再看到管道内壁）
        waterMesh = o;
        o.material = new THREE.MeshStandardMaterial({
          color: 0x1d6b70, roughness: 0.10, metalness: 0.30, side: THREE.DoubleSide,
          emissive: 0x072b30, emissiveIntensity: 0.16,
        });
        o.position.y += 0.25;      // 抬到船底附近，船看起来是浮着不是悬空
        o.renderOrder = 1;
      } else if (o.name.startsWith('cave_vines')) {
        // 洞顶苔藓帘：COLOR_0 直接是绿色，别再叠贴图
        o.material.vertexColors = true;
        o.material.emissive = new THREE.Color(0x1f3d12);
        o.material.emissiveIntensity = 0.35;   // 暗洞里苔藓带一点自发光，才有生气
        o.material.roughness = 0.88;
        o.material.metalness = 0.0;
        o.material.side = THREE.DoubleSide;
      } else {
        if (o.material.name && o.material.name.indexOf('tree_leaf') >= 0) leafMat = o.material;
        if (o.material.name && o.material.name.indexOf('forest_ground') >= 0) groundMat = o.material;
        o.material.vertexColors = true;   // COLOR_0 当轻 AO 用
        if (o.material.map) {             // 岩石贴图：掠射角度要清晰，调高各向异性
          o.material.map.anisotropy = 8;
          o.material.map.needsUpdate = true;
        }
        o.material.roughness = 0.94;
        o.material.metalness = 0.02;
        o.material.side = THREE.DoubleSide;
      }
      o.castShadow = true;
      o.receiveShadow = true;
      o.frustumCulled = false;  // 一整条洞，包围球裁剪会误剔
    }
  });
}

// ---------------- HUD ----------------
function flashBoost(n) {
  $('boostN').textContent = n;
  const b = $('boost');
  b.style.opacity = 1;
  setTimeout(() => { b.style.opacity = 0; }, 700);
}
const mm = $('minimap').getContext('2d');
function drawMinimap() {
  const W = 340, H = 340;
  mm.clearRect(0, 0, W, H);
  mm.fillStyle = 'rgba(40,28,16,0.6)'; mm.fillRect(0, 0, W, H);
  let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
  for (const p of CL) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z); }
  const pad = 30;
  const k = Math.min((W - pad * 2) / (maxX - minX || 1), (H - pad * 2) / (maxZ - minZ || 1));
  const tx = (x) => pad + (x - minX) * k;
  const tz = (z) => pad + (z - minZ) * k;
  mm.strokeStyle = 'rgba(120,200,230,0.55)'; mm.lineWidth = 3;
  mm.beginPath();
  CL.forEach((p, i) => (i ? mm.lineTo(tx(p.x), tz(p.z)) : mm.moveTo(tx(p.x), tz(p.z))));
  mm.stroke();
  mm.fillStyle = '#ffd27a';
  mm.beginPath(); mm.arc(tx(state.x), tz(state.z), 4.5, 0, Math.PI * 2); mm.fill();
  mm.fillStyle = '#ff5a48';
  for (const ob of (state.obstacles || [])) {
    mm.beginPath(); mm.arc(tx(ob.x), tz(ob.z), 3, 0, Math.PI * 2); mm.fill();
  }
}

function updateHud() {
  $('spd').textContent = (state.speed * 3.6).toFixed(0);
  $('prog').textContent = (state.progress * 100).toFixed(0) + '%' + (state.finished ? ' 终点' : '');
  $('driftSt').textContent = state.drifting ? ('甩尾 ' + state.driftTime.toFixed(1) + 's') : '—';
  $('yaw').textContent = (state.angVel * 57.3).toFixed(0) + '°/s';
  $('barFill').style.width = (state.progress * 100).toFixed(1) + '%';
  drawMinimap();
}

// ---------------- 主循环 ----------------
let last = performance.now(), acc = 0;
const FIXED = 1 / 120;
function loop(now) {
  const dtReal = Math.min(0.05, (now - last) / 1000);
  last = now; acc += dtReal;
  const input = {
    throttle: (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0),
    steer: (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0),
    drift: keys.has('ShiftLeft') || keys.has('ShiftRight'),
  };
  let guard = 0;
  while (acc >= FIXED && guard++ < 10) { step(FIXED, input); acc -= FIXED; }

  // 分段氛围：五段各有自己的雾色/光照
  const kind = (CL[state.nearest] || {}).kind || 'cave';
  // 分段可见性：只显示当前段和相邻段（云端云团/天空岛 z 会溢出到森林入口）
  const kIdx = SEG_ORDER.indexOf(kind);
  if (kIdx >= 0 && !state._segShown[kIdx]) {
    SEG_ORDER.forEach((k, i) => {
      const vis = (i >= kIdx) && (i <= kIdx + 1);   // 只看当前段和下一段（船往前开，回头看会穿帮但无所谓）
      for (const o of (segObjs[k] || [])) o.visible = vis;
    });
    state._segShown[kIdx] = true;
  }
  const atmo = ATMO[kind] || ATMO.cave;
  const inCave = kind === 'cave';
  const w = WEATHERS[weatherKey];
  // 洞内不吃天气；露天段把天气色混进雾色/光照
  const fogMix = inCave ? new THREE.Color(atmo.fog)
    : new THREE.Color(atmo.fog).lerp(new THREE.Color(w.fog), 0.6);
  scene.fog.color.lerp(fogMix, 0.04);
  scene.background.lerp(scene.fog.color, 0.04);
  scene.fog.near = THREE.MathUtils.lerp(scene.fog.near, atmo.near, 0.04);
  scene.fog.far = THREE.MathUtils.lerp(scene.fog.far, atmo.far, 0.04);
  for (const l of caveLights) l.intensity = THREE.MathUtils.lerp(l.intensity, atmo.lamps, 0.04);
  for (const l of caveLights) l.visible = atmo.lamps > 0;
  for (const b of caveBulbs) b.visible = false;
  if (sunLight) {
    sunLight.intensity = THREE.MathUtils.lerp(sunLight.intensity, atmo.sun * (inCave ? 1 : w.sunMul), 0.04);
    sunLight.color.lerp(new THREE.Color(w.sun), 0.04);
  }
  if (hemiLight) hemiLight.intensity = THREE.MathUtils.lerp(hemiLight.intensity, atmo.hemi * (inCave ? 1 : w.hemi), 0.04);
  // 云 / 树叶 / 地面跟着天气改色（云和岛共用一个材质，所以整体压色）
  if (skyDome && skyDome.material.uniforms) {
    skyDome.material.uniforms.topColor.value.lerp(new THREE.Color(inCave ? 0x3f86c8 : w.skyTop), 0.04);
    skyDome.material.uniforms.bottomColor.value.lerp(new THREE.Color(inCave ? 0xe4f2fb : w.skyBot), 0.04);
  }
  if (groundWater) groundWater.color.lerp(new THREE.Color(inCave ? 0x2f9a92 : w.water), 0.05);
  if (cloudMat) cloudMat.color.lerp(new THREE.Color(w.cloud), 0.05);
  if (leafMat) leafMat.color.lerp(new THREE.Color(w.leaf), 0.05);
  if (groundMat) groundMat.color.lerp(new THREE.Color(inCave ? 0xffffff : w.ground), 0.05);
  // 阴影相机跟着船走（否则阴影贴图覆盖整张地图，精度会糊成马赛克）
  if (sunLight && sunLight.intensity > 0.05) {
    sunLight.position.set(state.x - 55, state.y + 95, state.z + 65);
    sunLight.target.position.set(state.x, state.y, state.z);
    sunLight.target.updateMatrixWorld();
  }

  // 船体姿态
  boatRoot.position.set(state.x, state.y + Math.sin(now * 0.002) * 0.06, state.z);
  boatRoot.rotation.y = state.heading;
  boatRoot.rotation.x = -(state.pitch || 0);
  boatRoot.rotation.z = THREE.MathUtils.lerp(boatRoot.rotation.z, -state.angVel * 0.35, 0.12);
  // 追尾相机：陡坡/俯冲时用"后方赛道高度"兜底
  //   原因：固定"船后 11m + 4.4m"在 26° 下坡时，后方坡面比船高 5.4m，
  //   相机等于钻在坡体里，看到的是岩壁背面（用户反馈的"视角被山脉遮挡"）。
  const bx = Math.sin(state.heading), bz = Math.cos(state.heading);
  const backI = Math.max(0, Math.min(CL.length - 1, Math.round(state.nearest - 11 / 3)));
  const fwdI = Math.max(0, Math.min(CL.length - 1, Math.round(state.nearest + 14 / 3)));
  const camY = Math.max(state.y + 4.4, CL[backI].y + 4.6);
  const lookY = Math.max(state.y + 1.6, CL[fwdI].y + 2.4);
  const camTarget = new THREE.Vector3(state.x - bx * 11, camY, state.z - bz * 11);
  camera.position.lerp(camTarget, 1 - Math.exp(-6 * dtReal));
  camera.lookAt(state.x + bx * 14, lookY, state.z + bz * 14);
  if (skyDome) skyDome.position.set(camera.position.x, camera.position.y, camera.position.z);
  updateHud();
  if (composer) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ---------------- 启动 ----------------
initScene();
Promise.all([
  fetch('/data/cave_centerline.json?v=31').then((r) => r.json()),
  new Promise((res, rej) => new GLTFLoader().load('/models/cave/cave_shell.glb?v=31', res, undefined, rej)),
  new Promise((res, rej) => new GLTFLoader().load('/models/cave/stairs_shell.glb?v=31', res, undefined, rej)),
  new Promise((res, rej) => new GLTFLoader().load('/models/cave/cave_props.glb?v=31', res, undefined, rej)),
  new Promise((res, rej) => new GLTFLoader().load('/models/cave/cloud_shell.glb?v=31', res, undefined, rej)),
  new Promise((res, rej) => new GLTFLoader().load('/models/cave/fall_shell.glb?v=31', res, undefined, rej)),
  new Promise((res, rej) => new GLTFLoader().load('/models/cave/forest_shell.glb?v=31', res, undefined, rej)),
]).then(([data, shellGltf, stairsGltf, propsGltf, cloudGltf, fallGltf, forestGltf]) => {
  CL = data.points;
  state.obstacles = data.obstacles || [];
  // 分段可见性：每段模型只在自己和相邻段出现，否则云端云团会飘到森林里
  segObjs.cave = [shellGltf.scene, propsGltf.scene];
  segObjs.stairs = [stairsGltf.scene];
  segObjs.cloud = [cloudGltf.scene];
  segObjs.fall = [fallGltf.scene];
  segObjs.forest = [forestGltf.scene];
  // 洞壳（岩石贴图 + 水面 + 洞顶苔藓帘，同一个 GLB）
  tuneWorld(shellGltf.scene);
  scene.add(shellGltf.scene);
  // 阶梯段
  tuneWorld(stairsGltf.scene);
  scene.add(stairsGltf.scene);
  // 森林地面：换成草地贴图（原来用林地土，整片发棕）
  const grassTex = new THREE.TextureLoader().load('/textures/forest/grass_ground_diff_1k.jpg?v=31');
  grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
  grassTex.colorSpace = THREE.SRGBColorSpace;
  grassTex.repeat.set(16, 16);
  forestGltf.scene.traverse((o) => {
    if (o.isMesh && o.material && (o.material.name === 'forest_ground_mat' || o.material.name.indexOf('forest_ground') >= 0)) {
      o.material.map = grassTex;
      o.material.color.setHex(0x5f9a3a);
      o.material.needsUpdate = true;
    }
  });
  // 蘑菇 + 杂草
  propsGltf.scene.traverse((o) => {
    if (o.isMesh) {
      o.material.vertexColors = true;
      o.material.emissive = new THREE.Color(0x1e1006);
      o.material.emissiveIntensity = 0.18;
      o.material.side = THREE.DoubleSide;
    }
  });
  scene.add(propsGltf.scene);
  // 云端段：云海带 + 179 个云团 + 4 座天空岛（顶点色给颜色，材质纯白）
  tuneWorld(cloudGltf.scene);
  scene.add(cloudGltf.scene);
  // 瀑布段：白蓝水流带 + 两侧随落差切下去的岩壁 + 底部水花
  tuneWorld(fallGltf.scene);
  scene.add(fallGltf.scene);
  // 森林段：两岸草地 + 186 棵树 + 河道水面
  tuneWorld(forestGltf.scene);
  scene.add(forestGltf.scene);
  // 自检：贴图 / 水面 到底加载上没有
  let texInfo = '无贴图';
  let meshN = 0, hasWater = false, hasVines = false;
  shellGltf.scene.traverse((o) => {
    if (o.isMesh) {
      meshN++;
      if (o.name.startsWith('cave_water')) hasWater = true;
      if (o.name.startsWith('cave_vines')) hasVines = true;
      if (o.material && o.material.map && o.material.map.image) {
        texInfo = '贴图 ' + o.material.map.image.width + 'x' + o.material.map.image.height;
      }
    }
  });
  console.log('[cave] meshes=' + meshN + ' texture=' + texInfo + ' water=' + hasWater + ' vines=' + hasVines);
  const bl = document.getElementById('barLabel');
  if (bl) bl.textContent = 'cave · ' + texInfo + (hasWater ? ' · 水面OK' : ' · 缺水面!') + ' · ' + CL.length + ' 点';
  // 段落起始索引 + 按钮
  (data.sections || []).forEach((sec) => { if (segStart[sec.kind] == null) segStart[sec.kind] = sec.from; });
  const segBox = document.getElementById('segs');
  segBox.innerHTML = '';
  SEGMENTS.forEach((sg) => {
    const b = document.createElement('button');
    b.textContent = sg.name;
    b.dataset.kind = sg.kind;
    if (segStart[sg.kind] == null) { b.disabled = true; b.style.opacity = 0.35; }
    b.onclick = () => jumpToSegment(sg.kind);
    segBox.appendChild(b);
  });
  buildCenterLights();
  buildBoat();
  resetBoat();
  if (segStart.cave != null) jumpToSegment('cave');
  $('loading').style.opacity = 0;
  setTimeout(() => $('loading').remove(), 450);
  $('hud').style.display = 'block';
  requestAnimationFrame(loop);
}).catch((e) => { $('loading').remove(); showErr('加载失败：' + e + '\n\n请确认通过 http://127.0.0.1:3000/cave-demo.html 打开（直接双击文件会被浏览器拦跨域）。'); });
</script>
