<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b26">
<title>《激流勇进》3v3 组队模式 PRD</title>
<style>
  :root {
    --bg: #0d1b26;
    --card: #132938;
    --text: #e8f1f7;
    --muted: #93a9b8;
    --line: #23455a;
    --accent: #4ab3ff;
    --accent2: #ffc266;
  }
  * { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.75 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 0 14px 64px;
    word-break: break-word;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    margin: 0 -14px 18px; padding: 12px 14px;
    background: rgba(13, 27, 38, .92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  header .kicker { font-size: 12px; letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
  header h1 { margin: 2px 0 0; font-size: 17px; line-height: 1.35; }
  main { max-width: 920px; margin: 0 auto; }
  h1, h2, h3, h4 { line-height: 1.4; margin: 1.6em 0 .55em; }
  h1 { font-size: 24px; }
  h2 {
    font-size: 20px; padding-left: 10px;
    border-left: 4px solid var(--accent);
  }
  h3 { font-size: 17px; color: #cfe6f5; }
  h4 { font-size: 15px; color: #cfe6f5; }
  p { margin: .7em 0; }
  a { color: var(--accent); }
  ul, ol { padding-left: 1.35em; margin: .6em 0; }
  li { margin: .28em 0; }
  hr { border: none; border-top: 1px solid var(--line); margin: 2em 0; }
  blockquote {
    margin: 1em 0; padding: 10px 14px;
    background: rgba(74, 179, 255, .08);
    border-left: 3px solid var(--accent);
    border-radius: 6px; color: #cfe6f5;
  }
  blockquote p { margin: 0; }
  code {
    background: rgba(255, 255, 255, .08);
    padding: 1px 5px; border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .88em;
  }
  pre {
    background: #08131b; border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  pre code { background: none; padding: 0; font-size: 13px; line-height: 1.6; }
  .table-wrap {
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    margin: 1em 0; border: 1px solid var(--line); border-radius: 10px;
  }
  table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 14px; }
  th, td { padding: 9px 11px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  th { background: #173244; color: #cfe6f5; white-space: nowrap; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  tbody tr:nth-child(even) { background: rgba(255, 255, 255, .02); }
  .status { color: var(--muted); font-size: 14px; text-align: center; padding: 40px 0; }
  .fallback { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .fallback a { word-break: break-all; }
  @media (max-width: 420px) {
    body { font-size: 15px; padding: 0 12px 56px; }
    header { margin: 0 -12px 16px; padding: 10px 12px; }
    h2 { font-size: 18px; }
  }
</style>
</head>
<body>
<header>
  <div class="kicker">PRD · v0.1 · 待评审</div>
  <h1>《激流勇进》3v3 组队模式</h1>
</header>
<main>
  <div id="content" class="status">正在加载文档…</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
(function () {
  var content = document.getElementById('content');

  function enhance() {
    document.querySelectorAll('table').forEach(function (table) {
      if (table.parentElement.classList.contains('table-wrap')) return;
      var wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      table.parentNode.insertBefore(wrap, table);
      wrap.appendChild(table);
    });
  }

  function fallback(reason) {
    content.className = 'fallback';
    content.innerHTML =
      '<h3>文档没能自动渲染</h3>' +
      '<p>原因：' + reason + '</p>' +
      '<p>可以直接打开 Markdown 原文：</p>' +
      '<p><a href="./%E7%BB%84%E9%98%9F%E6%A8%A1%E5%BC%8F-PRD.md">组队模式-PRD.md</a></p>' +
      '<p>如果页面是空白的，通常是手机当前网络无法加载排版脚本（marked.js）。连上同一 Wi-Fi 后刷新，或让电脑把文档转成图片/PDF 发给你。</p>';
  }

  fetch('./%E7%BB%84%E9%98%9F%E6%A8%A1%E5%BC%8F-PRD.md')
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function (text) {
      if (typeof marked === 'undefined') {
        fallback('排版脚本未加载');
        return;
      }
      content.className = '';
      content.innerHTML = marked.parse(text);
      enhance();
    })
    .catch(function (err) {
      fallback(err.message || '读取文档失败');
    });
})();
</script>
</body>
</html>
